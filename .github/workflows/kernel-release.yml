name: Kernel release assets

# Publishes the kernel seed trees (Browserapp/kernels/*) as GitHub Release
# archives so that CI, packaging and local development can fetch kernels from
# a Release instead of paying git-LFS bandwidth/quota (the repo currently
# carries 4.22 GB of LFS kernel content; see docs/kernel-externalization.md).
#
# Asset layout produced by this workflow (draft release, tag `kernels-vX.Y.Z`):
#   kernels-windows-x64.tar.gz        1,966,533,237 B raw (single archive, gzip
#                                     lands well under the 2 GiB asset limit)
#   kernels-macos-x64.tar.gz            413,806,201 B raw
#   kernels-macos-arm64-app.tar.gz      640,419,628 B raw — Wayfern.app WITHOUT
#                                     wayfern_fonts (the raw tree is
#                                     2,154,337,132 B > 2,147,483,648 B, so
#                                     the seed is split by subdirectory)
#   kernels-macos-arm64-fonts.tar.gz  1,513,917,504 B raw — the wayfern_fonts
#                                     subtree (both halves extract into
#                                     kernels/macos-arm64/ and reassemble)
#   kernels-meta.tar.gz                          812 B — kernels/meta/*
#   SHA256SUMS-<job>.txt              per-job checksum lists (merged by the
#                                     finalize job into SHA256SUMS.txt)
# Archive format is tar.gz because the macOS seeds need symlinks (framework
# Versions/Current + Helpers/Libraries/Resources) and exec bits preserved,
# which zip does not guarantee; tar.gz is created and consumed natively on all
# three runner OSes and by scripts/fetch-kernels.js.
#
# Each platform job runs on ubuntu-latest and pulls ONLY its own platform via
# `git lfs pull --include` (scoped sparse-checkout in actions/checkout),
# keeping runner disk usage around 4 GiB worst case:
#   checkout ~0.3 GiB + LFS seed <= 2.1 GiB + tar.gz output <= 1.3 GiB
# (ubuntu-latest provides ~14 GiB free on / and ~14 GiB on /mnt — comfortable.)
#
# NOTE on triggering: this workflow is `workflow_dispatch` only. The GitHub UI
# lists a workflow_dispatch workflow AFTER the commit that adds it lands on
# the DEFAULT branch. To dispatch from a feature branch before merging, use
# the API (the workflow file must exist on that branch):
#   gh api -X POST repos/{owner}/{repo}/actions/workflows/kernel-release.yml/dispatches \
#     -f ref=optimization/p0-p4 -F 'inputs[kernel_tag]=kernels-v1'
#
# The release is created as a DRAFT and stays a draft: publishing is a manual
# maintainer step after reviewing assets (see docs/kernel-externalization.md).
# Deleting git-LFS as the CI source happens only AFTER a kernel release is
# published (flip checklist in the docs).

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Kernel release tag (must start with kernels-v, e.g. kernels-v1)'
        required: true
        default: 'kernels-v1'
      platforms:
        description: 'Which kernel platforms to package'
        required: false
        type: choice
        default: all
        options:
          - windows-x64
          - macos-x64
          - macos-arm64
          - all

permissions: {} # per-job grants below; every job that uploads needs contents: write

env:
  KERNEL_TAG: ${{ inputs.kernel_tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  validate-and-ensure-release:
    name: Validate inputs and ensure draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate tag and platform inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KERNEL_TAG" =~ ^kernels-v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "kernel_tag must match kernels-vX.Y.Z (got: $KERNEL_TAG). Refusing to touch app release tags." >&2
            exit 1
          fi
          echo "platforms input: ${{ inputs.platforms }}"
      - name: Create or refresh the draft release shell
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/kernel-release-notes.md"
          cat > "$notes_file" <<'NOTES'
          ## Kernel seed archive release

          Kernel binaries packaged from `Browserapp/kernels/` at the dispatch commit.
          Consumed by `npm run kernels:fetch` (scripts/fetch-kernels.js) and the CI
          packaging prefetch. Draft until verified — see docs/kernel-externalization.md.
          NOTES
          if gh release view "$KERNEL_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            is_draft="$(gh release view "$KERNEL_TAG" -R "$GH_REPO" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to mutate the published release $KERNEL_TAG; bump the kernel tag instead." >&2
              exit 1
            fi
            gh release edit "$KERNEL_TAG" -R "$GH_REPO" --target "${{ github.sha }}" \
              --draft --title "Kernel seed $KERNEL_TAG" --notes-file "$notes_file"
          else
            gh release create "$KERNEL_TAG" -R "$GH_REPO" --target "${{ github.sha }}" \
              --draft --title "Kernel seed $KERNEL_TAG" --notes-file "$notes_file"
          fi
          gh release view "$KERNEL_TAG" -R "$GH_REPO" --json isDraft,tagName,url

  meta:
    name: Meta archive (kernels/meta)
    needs: validate-and-ensure-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: kernel-release-${{ inputs.kernel_tag }}-meta
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/macos-arm64/
          sparse-checkout-cone-mode: false
      - name: Pull the meta LFS objects (812 B total)
        run: git lfs pull --include "Browserapp/kernels/meta/**"
      - name: Archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-assets"
          tar -czf "$RUNNER_TEMP/kernel-assets/kernels-meta.tar.gz" -C Browserapp/kernels meta
          ( cd "$RUNNER_TEMP/kernel-assets" && sha256sum --binary kernels-meta.tar.gz > SHA256SUMS-meta.txt )
          cat "$RUNNER_TEMP/kernel-assets/SHA256SUMS-meta.txt"
      - name: Upload to the draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$KERNEL_TAG" -R "$GH_REPO" \
            "$RUNNER_TEMP/kernel-assets/kernels-meta.tar.gz" \
            "$RUNNER_TEMP/kernel-assets/SHA256SUMS-meta.txt" --clobber

  windows-x64:
    name: Kernel archive (windows-x64)
    needs: validate-and-ensure-release
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows-x64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: kernel-release-${{ inputs.kernel_tag }}-windows-x64
      cancel-in-progress: true
    steps:
      # Disk budget: ~0.3 GiB checkout + 1.88 GiB LFS seed + <=1.3 GiB tar.gz.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/macos-arm64/
          sparse-checkout-cone-mode: false
      - name: Pull the windows-x64 LFS objects only
        run: git lfs pull --include "Browserapp/kernels/windows-x64/**"
      - name: Cross-check content against the committed LFS pointer oids
        shell: bash
        run: |
          set -euo pipefail
          # The repository's existing SHA-256 manifest for kernel files is the
          # set of git-LFS pointer oids committed in the tree. Every pulled
          # file must hash to its pointer oid, otherwise the archive would
          # ship content the repository never intended.
          node -e '
            const { execFileSync } = require("child_process");
            const fs = require("fs"), crypto = require("crypto");
            const listing = execFileSync("git", ["lfs", "ls-files", "--long"], { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 });
            let checked = 0, failures = 0;
            for (const line of listing.split("\n")) {
              const m = line.match(/^([0-9a-f]{64}) ([*-]) (.+)$/);
              if (!m) continue;
              const [, oid, marker, file] = m;
              if (!file.startsWith("Browserapp/kernels/")) continue;
              if (marker !== "*") { console.error(`NOT PULLED: ${file}`); failures += 1; continue; }
              const actual = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
              checked += 1;
              if (actual !== oid) { console.error(`OID MISMATCH: ${file}\n  pointer ${oid}\n  content ${actual}`); failures += 1; }
            }
            console.log(`LFS oid cross-check: ${checked} file(s) checked, ${failures} failure(s)`);
            if (failures > 0 || checked === 0) process.exit(1);
          '
          git lfs fsck
      - name: Archive, checksum and size-gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-assets"
          asset="$RUNNER_TEMP/kernel-assets/kernels-windows-x64.tar.gz"
          tar -czf "$asset" -C Browserapp/kernels windows-x64
          size=$(stat -c %s "$asset")
          echo "kernels-windows-x64.tar.gz: $size bytes ($(awk "BEGIN{printf \"%.2f\", $size/1073741824}") GiB)"
          if [ "$size" -ge 2147483648 ]; then
            echo "Asset exceeds the GitHub 2 GiB per-asset limit; split windows-x64 by subdirectory (see macos-arm64 below)." >&2
            exit 1
          fi
          ( cd "$RUNNER_TEMP/kernel-assets" && sha256sum --binary kernels-windows-x64.tar.gz > SHA256SUMS-windows-x64.txt )
          cat "$RUNNER_TEMP/kernel-assets/SHA256SUMS-windows-x64.txt"
      - name: Upload to the draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$KERNEL_TAG" -R "$GH_REPO" \
            "$RUNNER_TEMP/kernel-assets/kernels-windows-x64.tar.gz" \
            "$RUNNER_TEMP/kernel-assets/SHA256SUMS-windows-x64.txt" --clobber

  macos-x64:
    name: Kernel archive (macos-x64)
    needs: validate-and-ensure-release
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos-x64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: kernel-release-${{ inputs.kernel_tag }}-macos-x64
      cancel-in-progress: true
    steps:
      # Disk budget: ~0.3 GiB checkout + 0.4 GiB LFS seed + <=0.3 GiB tar.gz.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/macos-arm64/
          sparse-checkout-cone-mode: false
      - name: Pull the macos-x64 LFS objects only
        run: git lfs pull --include "Browserapp/kernels/macos-x64/**"
      - name: Cross-check content against the committed LFS pointer oids
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const { execFileSync } = require("child_process");
            const fs = require("fs"), crypto = require("crypto");
            const listing = execFileSync("git", ["lfs", "ls-files", "--long"], { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 });
            let checked = 0, failures = 0;
            for (const line of listing.split("\n")) {
              const m = line.match(/^([0-9a-f]{64}) ([*-]) (.+)$/);
              if (!m) continue;
              const [, oid, marker, file] = m;
              if (!file.startsWith("Browserapp/kernels/")) continue;
              if (marker !== "*") { console.error(`NOT PULLED: ${file}`); failures += 1; continue; }
              const actual = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
              checked += 1;
              if (actual !== oid) { console.error(`OID MISMATCH: ${file}\n  pointer ${oid}\n  content ${actual}`); failures += 1; }
            }
            console.log(`LFS oid cross-check: ${checked} file(s) checked, ${failures} failure(s)`);
            if (failures > 0 || checked === 0) process.exit(1);
          '
          git lfs fsck
      - name: Archive, checksum and size-gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-assets"
          asset="$RUNNER_TEMP/kernel-assets/kernels-macos-x64.tar.gz"
          # tar.gz (not zip): the seed carries an executable launcher script
          # and .app bundle conventions that need modes preserved.
          tar -czf "$asset" -C Browserapp/kernels macos-x64
          size=$(stat -c %s "$asset")
          echo "kernels-macos-x64.tar.gz: $size bytes"
          if [ "$size" -ge 2147483648 ]; then
            echo "Asset exceeds the GitHub 2 GiB per-asset limit." >&2
            exit 1
          fi
          ( cd "$RUNNER_TEMP/kernel-assets" && sha256sum --binary kernels-macos-x64.tar.gz > SHA256SUMS-macos-x64.txt )
          cat "$RUNNER_TEMP/kernel-assets/SHA256SUMS-macos-x64.txt"
      - name: Upload to the draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$KERNEL_TAG" -R "$GH_REPO" \
            "$RUNNER_TEMP/kernel-assets/kernels-macos-x64.tar.gz" \
            "$RUNNER_TEMP/kernel-assets/SHA256SUMS-macos-x64.txt" --clobber

  macos-arm64:
    name: Kernel archive (macos-arm64, fonts split)
    needs: validate-and-ensure-release
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos-arm64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: kernel-release-${{ inputs.kernel_tag }}-macos-arm64
      cancel-in-progress: true
    steps:
      # Disk budget: ~0.3 GiB checkout + 2.01 GiB LFS seed + two tar.gz
      # halves (<=0.5 GiB + <=0.8 GiB). The raw tree alone (2,154,337,132 B)
      # exceeds the GitHub 2 GiB per-asset limit, so the seed is split at the
      # wayfern_fonts subdirectory — both assets extract into
      # kernels/macos-arm64/ and reassemble the exact tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/macos-x64/
          sparse-checkout-cone-mode: false
      - name: Pull the macos-arm64 LFS objects only
        run: git lfs pull --include "Browserapp/kernels/macos-arm64/**"
      - name: Cross-check content against the committed LFS pointer oids
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const { execFileSync } = require("child_process");
            const fs = require("fs"), crypto = require("crypto");
            const listing = execFileSync("git", ["lfs", "ls-files", "--long"], { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 });
            let checked = 0, failures = 0;
            for (const line of listing.split("\n")) {
              const m = line.match(/^([0-9a-f]{64}) ([*-]) (.+)$/);
              if (!m) continue;
              const [, oid, marker, file] = m;
              if (!file.startsWith("Browserapp/kernels/")) continue;
              if (marker !== "*") { console.error(`NOT PULLED: ${file}`); failures += 1; continue; }
              const actual = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
              checked += 1;
              if (actual !== oid) { console.error(`OID MISMATCH: ${file}\n  pointer ${oid}\n  content ${actual}`); failures += 1; }
            }
            console.log(`LFS oid cross-check: ${checked} file(s) checked, ${failures} failure(s)`);
            if (failures > 0 || checked === 0) process.exit(1);
          '
          git lfs fsck
      - name: Archive (app half + fonts half), checksum and size-gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-assets"
          # Exactly one wayfern_fonts directory is expected inside the seed.
          fonts_rel="$(cd Browserapp/kernels && find macos-arm64 -type d -name wayfern_fonts)"
          if [ "$(printf '%s\n' "$fonts_rel" | grep -c .)" != "1" ]; then
            echo "Expected exactly one wayfern_fonts directory under kernels/macos-arm64, got:" >&2
            printf '%s\n' "$fonts_rel" >&2
            exit 1
          fi
          echo "fonts subtree: $fonts_rel"
          app_asset="$RUNNER_TEMP/kernel-assets/kernels-macos-arm64-app.tar.gz"
          fonts_asset="$RUNNER_TEMP/kernel-assets/kernels-macos-arm64-fonts.tar.gz"
          # tar.gz (not zip): the .app bundle relies on symlinks (framework
          # Versions/Current + Helpers/Libraries/Resources) and exec bits.
          tar -czf "$app_asset" --exclude='*wayfern_fonts' -C Browserapp/kernels macos-arm64
          tar -czf "$fonts_asset" -C Browserapp/kernels "$fonts_rel"
          for asset in "$app_asset" "$fonts_asset"; do
            size=$(stat -c %s "$asset")
            echo "$(basename "$asset"): $size bytes"
            if [ "$size" -ge 2147483648 ]; then
              echo "Asset exceeds the GitHub 2 GiB per-asset limit; adjust the split boundary." >&2
              exit 1
            fi
          done
          ( cd "$RUNNER_TEMP/kernel-assets" \
            && sha256sum --binary kernels-macos-arm64-app.tar.gz kernels-macos-arm64-fonts.tar.gz > SHA256SUMS-macos-arm64.txt )
          cat "$RUNNER_TEMP/kernel-assets/SHA256SUMS-macos-arm64.txt"
      - name: Upload to the draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$KERNEL_TAG" -R "$GH_REPO" \
            "$RUNNER_TEMP/kernel-assets/kernels-macos-arm64-app.tar.gz" \
            "$RUNNER_TEMP/kernel-assets/kernels-macos-arm64-fonts.tar.gz" \
            "$RUNNER_TEMP/kernel-assets/SHA256SUMS-macos-arm64.txt" --clobber

  finalize:
    name: Assemble SHA256SUMS.txt (release stays draft)
    needs: [meta, windows-x64, macos-x64, macos-arm64]
    if: >-
      ${{ inputs.platforms == 'all'
          && needs.meta.result == 'success'
          && needs.windows-x64.result == 'success'
          && needs.macos-x64.result == 'success'
          && needs.macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Merge per-job checksums into SHA256SUMS.txt
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/kernel-release-assets"
          rm -rf "$staging" && mkdir -p "$staging"
          gh release download "$KERNEL_TAG" -R "$GH_REPO" --pattern 'SHA256SUMS-*.txt' --dir "$staging"
          cat "$staging"/SHA256SUMS-*.txt | sort -k2 > "$staging/SHA256SUMS.txt"
          cat "$staging/SHA256SUMS.txt"
          # Completeness gate: every archive shipped by the platform jobs must
          # be listed in the merged manifest.
          expected=(
            kernels-meta.tar.gz
            kernels-windows-x64.tar.gz
            kernels-macos-x64.tar.gz
            kernels-macos-arm64-app.tar.gz
            kernels-macos-arm64-fonts.tar.gz
          )
          for asset in "${expected[@]}"; do
            grep -Fq " $asset" "$staging/SHA256SUMS.txt" || { echo "missing checksum entry: $asset" >&2; exit 1; }
          done
          gh release upload "$KERNEL_TAG" -R "$GH_REPO" "$staging/SHA256SUMS.txt" --clobber
      - name: Summary (draft stays unpublished)
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$KERNEL_TAG" -R "$GH_REPO" --json isDraft,tagName,assets \
            --jq '{draft: .isDraft, tag: .tagName, assets: [.assets[] | {name, size}]}'
          echo "Draft kernel release is assembled. Review the assets, then publish manually:"
          echo "  gh release edit $KERNEL_TAG -R $GH_REPO --draft=false"
          echo "After publishing, follow the CI flip checklist in docs/kernel-externalization.md."
