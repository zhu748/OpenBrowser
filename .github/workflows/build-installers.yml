name: Build OpenBrowser installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Application release tag; kernels are downloaded after installation'
        required: true
        default: 'v1.0.0'
      target_platform:
        description: 'Build all installers or recover one platform without rebuilding completed assets'
        required: false
        type: choice
        default: all
        options: [all, windows-x86_64, linux-x86_64, macos-x86_64, macos-arm64]

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  GH_TOKEN: ${{ github.token }}
  OPENBROWSER_PACKAGE_VARIANT: without-kernel
  OPENBROWSER_BUNDLE_KERNEL: 'false'
  RELEASE_NOTES: |
    - 不再使用 Git LFS 或内置内核；首次使用时在程序内下载官方内核。
    - 修复四平台在线安装包的应用内更新识别。
    - 发布任务自动签名并验证 SHA256SUMS.txt，验证失败时保留草稿。

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate source, tag and draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_tag="v$(node -p 'require("./Browserapp/package.json").version')"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo 'Release tag must match Browserapp/package.json version' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true
      - name: Select platform builders
        id: matrix
        shell: bash
        env:
          TARGET_PLATFORM: ${{ inputs.target_platform }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const platforms = [
            {id:'windows-x86_64',platform:'Windows x86_64',runner:'windows-2022',arch:'x86_64'},
            {id:'linux-x86_64',platform:'Linux x86_64',runner:'ubuntu-22.04',arch:'x86_64'},
            {id:'macos-x86_64',platform:'macOS Intel',runner:'macos-15-intel',arch:'x86_64'},
            {id:'macos-arm64',platform:'macOS ARM',runner:'macos-latest',arch:'arm64'},
          ];
          const target = process.env.TARGET_PLATFORM || 'all';
          const selected = platforms.filter(p => target === 'all' || p.id === target);
          if (!selected.length) throw new Error('Unsupported installer platform');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'platforms=' + JSON.stringify(selected) + '\n');
          JS

  build:
    name: Online installer (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    defaults:
      run:
        shell: bash
        working-directory: Browserapp
    env:
      OPENBROWSER_PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - name: Install dependencies
        run: |
          set -euo pipefail
          expected_arch="${{ matrix.arch }}"
          if [[ "$expected_arch" == x86_64 ]]; then expected_arch=x64; fi
          test "$(node -p process.arch)" = "$expected_arch"
          npm ci --include=dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Build and validate Rust core
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ../Cargo.toml --all -- --check
          cargo clippy --manifest-path ../Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path ../Cargo.toml --workspace --locked
          npm run build:rustcore
          npm run selftest:rustrelease
      - name: Verify online packaging and kernel download policy
        run: |
          set -euo pipefail
          npm run selftest -- onlinepackage
          npm run selftest:kernel
          npm run selftest -- reviewupdate
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Package installer
        run: npm run package:portable
      - name: Verify installer payload
        id: verify
        run: node scripts/verify-online-package.js --github-output "$GITHUB_OUTPUT"
      - name: Upload verified installer to draft
        env:
          GH_REPO: ${{ github.repository }}
          ARTIFACT: ${{ steps.verify.outputs.artifact }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true
          notes_file="$RUNNER_TEMP/openbrowser-online-notes.md"
          printf 'OpenBrowser %s online installers\n' "$RELEASE_TAG" > "$notes_file"
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" "$ARTIFACT"

  finalize:
    name: Publish completed release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          sparse-checkout: Browserapp/automation
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify complete release and detached signature
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(
            OpenBrowser-Windows-x86_64-without-kernel-setup.exe
            OpenBrowser-Linux-x86_64-without-kernel.tar.gz
            OpenBrowser-macOS-x86_64-without-kernel.dmg
            OpenBrowser-macOS-arm64-without-kernel.dmg
          )
          staging="$RUNNER_TEMP/openbrowser-online-assets"
          mkdir -p "$staging"
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "$asset" --dir "$staging"
          done
          (cd "$staging" && sha256sum --binary "${assets[@]}" > SHA256SUMS.txt)
      - name: Sign checksum manifest and verify trust root
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          OPENBROWSER_UPDATE_SIGNING_KEY: ${{ secrets.OPENBROWSER_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/openbrowser-online-assets"
          if [[ -z "${OPENBROWSER_UPDATE_SIGNING_KEY:-}" ]]; then
            echo 'Release signing secret is not configured; refusing to publish.' >&2
            exit 1
          fi
          node Browserapp/automation/update-trust-tool.js sign "$staging/SHA256SUMS.txt"
          unset OPENBROWSER_UPDATE_SIGNING_KEY
          node Browserapp/automation/update-trust-tool.js verify "$staging/SHA256SUMS.txt" "$staging/SHA256SUMS.txt.sig"
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" "$staging/SHA256SUMS.txt" "$staging/SHA256SUMS.txt.sig" --clobber
          notes="$RUNNER_TEMP/openbrowser-online-notes.md"
          cat > "$notes" <<EOF
          ## OpenBrowser **${RELEASE_TAG}**

          提供 Windows x86_64、macOS Intel、macOS ARM 和 Linux x86_64 安装包。
          安装包不预装浏览器内核；首次启动后可在程序中联网下载官方 Chrome Stable，或选择自定义内核。
          所有安装包均验证应用与 Rust 核心版本、确认不含内核占位文件，并提供 SHA256SUMS.txt 及其 Ed25519 签名。
          旧版 1.0.0 的更新信任根不同，请手动安装本次重发的安装包一次，以接入新的更新签名。
          EOF
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --title "OpenBrowser $RELEASE_TAG" --notes-file "$notes"
