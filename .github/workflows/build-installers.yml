name: Build OpenBrowser installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Application release tag; kernels are downloaded after installation'
        required: true
        default: 'v1.0.0'
      target_platform:
        description: 'Build all installers or recover one platform without rebuilding completed assets'
        required: false
        type: choice
        default: all
        options: [all, windows-x86_64, linux-x86_64, macos-x86_64, macos-arm64]
      staging_tag:
        description: 'Optional pre-created <release_tag>-candidate-* tag and draft for a replacement release'
        required: false
        type: string

permissions: {}

concurrency:
  group: installers-${{ inputs.staging_tag || inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  ASSET_TAG: ${{ inputs.staging_tag || inputs.release_tag }}
  GH_TOKEN: ${{ github.token }}
  OPENBROWSER_PACKAGE_VARIANT: without-kernel
  OPENBROWSER_BUNDLE_KERNEL: 'false'
  RELEASE_NOTES: |
    - 优化前端列表、RPA、云配置及 API/MCP 的异步状态与性能。
    - 修复 Canvas、音频、VideoFrame 及 Worker 指纹注入的原生语义和资源释放。
    - 增加有界缓存、CDP/BiDi 超时预算与完整回归检查。
    - 精简工作台服务分发与构建补丁，统一启动取消和异常退出清理。
    - 分离 UA 配置与注入源码，修复随机 UA、Client Hints 别名及跨 Worker 一致性。
    - 补充 Chromium/Firefox 原生交付验证，保持既有指纹身份与随机种子稳定。
    - 恢复独立系统标题栏与可拖动边框，修复右上角遮挡，功能页改为独立窗口并显示公网出口 IP。
    - 移除失效视频教程，三点菜单支持左键；随机 UA 与指纹同步更新、保留系统，修复 Firefox 选择和表单保存。
    - Chrome 随机 UA 在选定内核分支内改变补丁尾号，保存和启动保留结果，请求头与 Client Hints 同步。
    - 修复旧隐藏 UA 覆盖、跨 iframe 网络参数回退及原生 getter 接收者语义，校正实际内核预览与 Firefox 回读。
    - 新建/编辑预览与保存共用身份 ID；Firefox 注入源码变化时退役旧 Service Worker 注册并保留站点存储。
    - 启动按钮按真实进度显示启动中、检测 IP、启动窗口；关闭时显示同步中，刷新界面可恢复状态。
    - 修复内联 Worker URL、hashbang 和 UTF-8 首读注入，保留模块 MIME 与原生加载错误，隔离页面对加载 API 的改写。
    - Firefox 使用原生 major.0 UA，禁用 UA 单项随机；一键随机继续更新其他指纹，规范化旧自动 UA 并保留手工值与 seed。
    - 内核版本下拉框显示 Chrome/Firefox 名称与版本，保留原有选择值及“保持最新”。
    - 不再使用 Git LFS 或内置内核；首次使用时在程序内下载官方内核。
    - 修复四平台在线安装包的应用内更新识别。
    - 发布任务自动签名并验证 SHA256SUMS.txt，验证失败时保留草稿。

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.staging_tag || inputs.release_tag }}
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate source, tag and draft release
        id: source
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_tag="v$(node -p 'require("./Browserapp/package.json").version')"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo 'Release tag must match Browserapp/package.json version' >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [[ "$ASSET_TAG" != "$RELEASE_TAG" ]]; then
            case "$ASSET_TAG" in
              "$RELEASE_TAG"-candidate-*) ;;
              *) echo 'Invalid staging tag' >&2; exit 1 ;;
            esac
          fi
          git check-ref-format "refs/tags/$ASSET_TAG"
          test "$sha" = "$(git rev-parse "refs/tags/$ASSET_TAG^{commit}")"
          if [[ "$ASSET_TAG" != "$RELEASE_TAG" ]]; then
            test "$(gh release view "$ASSET_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true
          elif gh release view "$ASSET_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            test "$(gh release view "$ASSET_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$ASSET_TAG" --repo "$GH_REPO" --target "$sha" --draft --title "OpenBrowser $RELEASE_TAG" --notes "$RELEASE_NOTES"
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Select platform builders
        id: matrix
        shell: bash
        env:
          TARGET_PLATFORM: ${{ inputs.target_platform }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const platforms = [
            {id:'windows-x86_64',platform:'Windows x86_64',runner:'windows-2022',arch:'x86_64'},
            {id:'linux-x86_64',platform:'Linux x86_64',runner:'ubuntu-22.04',arch:'x86_64'},
            {id:'macos-x86_64',platform:'macOS Intel',runner:'macos-15-intel',arch:'x86_64'},
            {id:'macos-arm64',platform:'macOS ARM',runner:'macos-latest',arch:'arm64'},
          ];
          const target = process.env.TARGET_PLATFORM || 'all';
          const selected = platforms.filter(p => target === 'all' || p.id === target);
          if (!selected.length) throw new Error('Unsupported installer platform');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'platforms=' + JSON.stringify(selected) + '\n');
          JS

  build:
    name: Online installer (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    defaults:
      run:
        shell: bash
        working-directory: Browserapp
    env:
      OPENBROWSER_PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - name: Install dependencies
        run: |
          set -euo pipefail
          expected_arch="${{ matrix.arch }}"
          if [[ "$expected_arch" == x86_64 ]]; then expected_arch=x64; fi
          test "$(node -p process.arch)" = "$expected_arch"
          npm ci --include=dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build and validate Rust core
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ../Cargo.toml --all -- --check
          cargo clippy --manifest-path ../Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path ../Cargo.toml --workspace --locked
          npm run build:rustcore
          npm run selftest:rustrelease
      - name: Verify online packaging and kernel download policy
        run: |
          set -euo pipefail
          npm run selftest -- onlinepackage
          npm run selftest:kernel
          npm run selftest -- reviewupdate
          npm run selftest:proxyconcurrency
          npm run selftest:dnsleakclassify
      - name: Rebuild and verify the workbench included in the installer
        id: workbench
        run: |
          set -euo pipefail
          npm run rebuild:ui
          node rebuild/compiler/source-selftest.cjs
          test -z "$(git ls-files -- roxy-ui)"
          workbench_sha="$(node scripts/package-digests.js roxy-ui)"
          printf 'sha=%s\n' "$workbench_sha" >> "$GITHUB_OUTPUT"
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Package installer
        # npm's local prepackage hook would rebuild the workbench we just verified.
        run: node scripts/package-portable.js
      - name: Verify staged application and inspect final installer artifact
        id: verify
        env:
          WORKBENCH_SHA: ${{ steps.workbench.outputs.sha }}
        run: node scripts/verify-online-package.js --workbench-sha "$WORKBENCH_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Upload verified installer to draft
        env:
          GH_REPO: ${{ github.repository }}
          ARTIFACT: ${{ steps.verify.outputs.artifact }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(gh release view "$ASSET_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/release-artifact-manifest.js create "$(dirname "$ARTIFACT")" "$RELEASE_TAG" "$SOURCE_SHA" "$(basename "$ARTIFACT")"
          notes_file="$RUNNER_TEMP/openbrowser-online-notes.md"
          printf 'OpenBrowser %s online installers\n' "$RELEASE_TAG" > "$notes_file"
          bash scripts/publish-release.sh "$ASSET_TAG" "$notes_file" "$ARTIFACT" "$ARTIFACT.build.json"

  finalize:
    name: Publish completed release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: |
            Browserapp/automation
            Browserapp/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify installer checksums and source commit
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          assets=(
            OpenBrowser-Windows-x86_64-without-kernel-setup.exe
            OpenBrowser-Linux-x86_64-without-kernel.tar.gz
            OpenBrowser-macOS-x86_64-without-kernel.dmg
            OpenBrowser-macOS-arm64-without-kernel.dmg
          )
          staging="$RUNNER_TEMP/openbrowser-online-assets"
          mkdir -p "$staging"
          for asset in "${assets[@]}"; do
            gh release download "$ASSET_TAG" --repo "$GH_REPO" --pattern "$asset" --pattern "$asset.build.json" --dir "$staging"
          done
          node Browserapp/scripts/release-artifact-manifest.js verify "$staging" "$RELEASE_TAG" "$SOURCE_SHA" "${assets[@]}"
      - name: Sign checksum manifest and verify trust root
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          OPENBROWSER_UPDATE_SIGNING_KEY: ${{ secrets.OPENBROWSER_UPDATE_SIGNING_KEY }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/openbrowser-online-assets"
          tag_ref="refs/tags/$ASSET_TAG"
          tag_sha=$(git ls-remote origin "$tag_ref" "$tag_ref^{}" | awk '$2 ~ /\^\{\}$/ { peeled=$1; next } { raw=$1 } END { print peeled ? peeled : raw }')
          test "$tag_sha" = "$SOURCE_SHA"
          test "$(gh release view "$ASSET_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true
          if [[ -z "${OPENBROWSER_UPDATE_SIGNING_KEY:-}" ]]; then
            echo 'Release signing secret is not configured; refusing to publish.' >&2
            exit 1
          fi
          node Browserapp/automation/update-trust-tool.js sign "$staging/SHA256SUMS.txt"
          unset OPENBROWSER_UPDATE_SIGNING_KEY
          node Browserapp/automation/update-trust-tool.js verify "$staging/SHA256SUMS.txt" "$staging/SHA256SUMS.txt.sig"
          gh release upload "$ASSET_TAG" --repo "$GH_REPO" "$staging/SHA256SUMS.txt" "$staging/SHA256SUMS.txt.sig" --clobber
          if [[ "$ASSET_TAG" != "$RELEASE_TAG" ]]; then
            echo "Verified installers and signature are ready in draft $ASSET_TAG."
            exit 0
          fi
          notes="$RUNNER_TEMP/openbrowser-online-notes.md"
          cat > "$notes" <<EOF
          ## OpenBrowser **${RELEASE_TAG}**

          提供 Windows x86_64、macOS Intel、macOS ARM 和 Linux x86_64 安装包。
          安装包不预装浏览器内核；首次启动后可在程序中联网下载官方 Chrome Stable，或选择自定义内核。

          ### 本次更新

          - 前端列表缓存、增量状态与界面持久化优化；修复代理、云配置和 API/MCP 的迟到响应覆盖。
          - RPA 保留未保存草稿和勾选，任务请求合并，搜索与筛选复用快照。
          - Canvas、音频和 VideoFrame 原生参数、布局、快照与资源释放修复，统一页面和 Worker 行为。
          - 注入缓存增加条数和字节上限；CDP/BiDi 使用完整超时预算，避免过期命令补发。
          - 工作台服务分发、通知逻辑与构建补丁职责拆分，常规构建证据写入工作目录。
          - Chromium/Firefox 共用启动准备与取消检查；异常退出及时排空外部浏览器和存储。
          - UA 配置解析与浏览器安装源码分离，修复随机 UA 系统选择、Client Hints 字段别名及 UAData 接收者校验。
          - 统一文档和 Worker 的可选 formFactors、CDP 与请求头设备分类，补齐双内核原生回归。
          - 恢复独立系统标题栏、拖动和边缘缩放；修复右上角图标遮挡，功能页在独立窗口打开，顶部显示公网出口 IP。
          - 移除失效视频教程，三点菜单支持左键直接打开。
          - Chrome 随机 UA 保留系统与所选内核分支，改变补丁尾号；指纹种子同步更新，保存和启动保留结果，请求头与 Client Hints 一致。
          - 迁移旧隐藏 UA 覆盖，使用实际内核预览；修复跨 iframe 网络参数回退、getter 接收者与错误 Realm，并保留 Firefox 回读中的共享引用。
          - 修复新建/编辑预览到正式保存的派生噪声偏差；Firefox 注入源码变化时使旧 Service Worker 注册失效，保留 Cookie 与站点存储，补齐 Blob/Data、模块依赖、嵌套及缓存重启验证。
          - 对齐启动和关闭状态：按实际阶段显示启动中、检测 IP、启动窗口，关闭时显示同步中；刷新界面可恢复进度，检测失败后可重试。
          - 修复内联 Worker 大写/空白 URL、hashbang 换行和 UTF-8 解码造成的首读泄漏或脚本失败；保留模块 MIME、原生加载错误，私有读取不调用页面改写的 XHR/编解码 API。
          - Firefox 保持原生 major.0 UA，禁用 UA 单项随机并提供说明；一键随机继续更新其他指纹。旧自动 UA 规范化，手工自定义值与既有 seed 保留。
          - 内核版本选项显示为 Chrome 159、Firefox 160 等完整名称，保留“保持最新”选项。

          ### 安装与验证

          所有平台均检查暂存应用与 Rust 核心版本、更新信任配置及无内置内核策略；Linux 逐项比对最终 tar.gz，macOS 只读挂载 DMG 比对并验签应用，Windows 检查 NSIS 归档及关键文件字节（不运行安装或卸载）。提供 SHA256SUMS.txt 及其 Ed25519 签名。
          本次为同版本重新发布，请手动下载安装新的安装包；旧构建将被替换。
          EOF
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --title "OpenBrowser $RELEASE_TAG" --notes-file "$notes"
