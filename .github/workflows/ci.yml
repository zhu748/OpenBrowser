name: CI

# Continuous integration gate for every push and pull request:
# - lint: ESLint correctness rules (zero-error baseline, see eslint.config.js)
# - smoke: dependency-free Node selftests (no Electron binary, no kernels)
# - rust: fmt + clippy + tests + JS<->Rust bridge selftests (parity + chaos)
# Full installer builds remain in build-installers.yml (manual dispatch).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep every selftest deterministic in CI: no ambient config, no updates.
  OPENBROWSER_ALLOW_PRIVATE_OUTBOUND: '0'
  OPENBROWSER_RPA_TASK_TIMEOUT_MS: '0'

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Browserapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      # Selftests run under plain Node — skip the Electron binary download.
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run lint

  smoke:
    name: Node selftests (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Browserapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Selftests in this job need no kernels; exclude the whole LFS tree.
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      # Offline unit checks for the kernel-release fetch tooling (no network,
      # no kernels needed): keeps scripts/fetch-kernels.js covered by the
      # per-push gate. The real download path is exercised by the
      # kernel-release / build-installers workflows.
      - name: Install Linux desktop validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
      - name: Kernel fetch tooling selftest
        run: node scripts/fetch-kernels.js --selftest
      # Aggregate gate: scripts/selftest-all.js runs every dependency-free
      # selftest in one shot — a new selftest added to the SUITE registry in
      # scripts/selftest-all.js runs here automatically instead of waiting for
      # someone to paste another line into this workflow. Entries flagged
      # darwinOnly are reported as skips on this Linux job (they need the
      # macOS kernel launcher) and never count as passes.
      - name: Build the default workbench from source
        run: |
          npm run typecheck:renderer
          npm run rebuild:ui
          node rebuild/compiler/source-selftest.cjs
          test -z "$(git ls-files -- roxy-ui)"
      - name: Full selftest aggregate (kernel-free suite)
        run: npm run selftest:all
        env:
          # The aggregate suite's native-only availability probe must SKIP when
          # this job provides no browser: without the guard the gates pick up
          # the runner's unusable google-chrome from PATH, fail to launch it
          # (exit 1) or hang to the per-script timeout.
          OPENBROWSER_REQUIRE_EXPLICIT_BINARY: '1'

  smoke-windows:
    name: Node selftests (Windows smoke)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Browserapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      # Windows-only code paths (path handling, drive letters, updater) get a
      # small per-push signal; the full smoke matrix stays on ubuntu for cost.
      - name: Windows-relevant selftests
        run: |
          npm run selftest:hardening
          npm run selftest:port
          npm run selftest:version

  rust:
    name: Rust core (fmt + clippy + tests + bridge selftests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cargo needs no kernels; excluding the LFS tree also keeps the
          # checkout small (the kernel bundle is 5k+ files).
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      # toolchain is a required input at this SHA — without it the job dies
      # at "Process completed with exit code 1" before fmt/clippy ever run.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Cache the cargo registry + target dir across runs (the Node jobs all
      # use actions/setup-node's npm cache; the Rust graph was rebuilt cold
      # on every push before this).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The bridge selftests below run plain Node scripts; pin the same Node
      # the lint/smoke jobs use so runner image drift cannot change results.
      # No npm ci: their module tree (rust-core-bridge.js, the fixtures,
      # proxy-forwarder.js) is node-builtin-only — nothing imports from
      # node_modules.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      # --- JS<->Rust bridge gate --------------------------------------------
      # The bridge (automation/rust-core-bridge.js + the gated branch in
      # proxy-forwarder.js startAuthenticatedProxy) is the only
      # production-reachable Rust surface (docs/rust-core-decision.md), but
      # until now it was exercised only by the manually dispatched
      # build-installers workflow: a push that broke the JS bridge layer
      # stayed green here. parity/chaos need no Chromium and no display —
      # node builtins (http/net/child_process + ps) plus the built binary —
      # so they slot into this job behind a release build.
      # build:rustcore = scripts/build-rust-core.js: cargo build --release
      # --locked at the repo root, copy to Browserapp/rust-core/, then
      # verify the version JSON — it exits non-zero on any mismatch.
      - name: Build Rust core (release)
        working-directory: Browserapp
        run: npm run build:rustcore
      # Pin the binary explicitly instead of relying on the target/release
      # fallback candidate in findRustCoreBinary(): the copied artifact is
      # the exact binary build:rustcore just verified.
      - name: Rust bridge parity selftest (JS<->Rust)
        working-directory: Browserapp
        env:
          OPENBROWSER_RUST_CORE_BINARY: ${{ github.workspace }}/Browserapp/rust-core/openbrowser-core
        run: npm run selftest:rustparity
      - name: Rust bridge chaos selftest (JS<->Rust)
        working-directory: Browserapp
        env:
          OPENBROWSER_RUST_CORE_BINARY: ${{ github.workspace }}/Browserapp/rust-core/openbrowser-core
        run: npm run selftest:rustchaos

  # Native fingerprint gates on real browser kernels. Browsers come from the
  # playwright-managed cache (pinned, no apt flakiness); the gates exit 2 when a
  # browser is missing, which the runner reports as a skip, never a false pass.
  native-gates:
    name: Native browser gates (${{ matrix.browser }})
    # Match the Linux release host; the production custom-kernel probe uses
    # Chromium's sandbox and needs working unprivileged user namespaces.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    defaults:
      run:
        working-directory: Browserapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      - name: Install stable browser for native gates
        run: |
          if [[ "${{ matrix.browser }}" == "firefox" ]]; then
            npx @puppeteer/browsers install firefox@stable --path "$HOME/.cache/ob-browsers"
          else
            npx @puppeteer/browsers install chrome@stable --path "$HOME/.cache/ob-browsers"
          fi
      - name: Fingerprint native consistency + worker delivery gates (Chromium)
        if: matrix.browser == 'chromium'
        env:
          OPENBROWSER_NATIVE_NO_SANDBOX: '1'
        run: |
          # Resolved at run time and exported for the gate: puppeteer installs
          # into a VERSIONED directory (chrome/linux-<build>/chrome-linux64/chrome)
          # and workflow `env:` cannot expand shell variables — a static path
          # here has silently skipped the gate on every stable bump.
          CHROME_BIN="$(find "$HOME/.cache/ob-browsers" -type f -name chrome -path '*/chrome-linux64/*' | head -n 1)"
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "chrome binary not found under $HOME/.cache/ob-browsers" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN"
          export OPENBROWSER_CHROMIUM_BINARY="$CHROME_BIN"
          node scripts/native-test-runner.js --runtime chromium
          # A stalled service must not leave external browsers orphaned when
          # the fatal host deadline expires. Use the same independent kernel.
          node node_modules/electron/install.js
          npm run rebuild:ui
          OPENBROWSER_TEST_KERNEL_BINARY="$CHROME_BIN" node rebuild/quit-failure-selftest.cjs --fatal-hang
          OPENBROWSER_TEST_KERNEL_BINARY="$CHROME_BIN" node rebuild/quit-failure-selftest.cjs --normal-hang
          OPENBROWSER_TEST_KERNEL_BINARY="$CHROME_BIN" node rebuild/import-ui-selftest.cjs
          npx @puppeteer/browsers install firefox@stable --path "$HOME/.cache/ob-browsers"
          FIREFOX_BIN="$(find "$HOME/.cache/ob-browsers" -type f -name firefox -path '*/firefox/*' | head -n 1)"
          test -x "$FIREFOX_BIN"
          OPENBROWSER_TEST_KERNEL_BINARY="$CHROME_BIN" OPENBROWSER_FIREFOX_BINARY="$FIREFOX_BIN" node rebuild/profile-fingerprint-ui-selftest.cjs
          OPENBROWSER_TEST_KERNEL_BINARY="$CHROME_BIN" node rebuild/profile-lifecycle-ui-selftest.cjs

      - name: Install Firefox certificate tools
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools

      - name: Firefox native identity, API control, data retention and worker delivery
        if: matrix.browser == 'firefox'
        run: |
          FIREFOX_BIN="$(find "$HOME/.cache/ob-browsers" -type f -name firefox -path '*/firefox/*' | head -n 1)"
          if [ -z "$FIREFOX_BIN" ] || [ ! -x "$FIREFOX_BIN" ]; then
            echo "Firefox binary not found under $HOME/.cache/ob-browsers" >&2
            exit 1
          fi
          export OPENBROWSER_FIREFOX_BINARY="$FIREFOX_BIN"
          node scripts/native-test-runner.js --runtime firefox

      - name: Preserve native gate reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-gates-${{ matrix.browser }}
          path: work/native-gates/
          if-no-files-found: error

  review-boundaries:
    name: Storage and runtime boundaries (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
        include:
          - os: ubuntu-latest
            node: '22.13.0'
    defaults:
      run:
        working-directory: Browserapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - name: Install locked runtime dependencies without browser downloads
        run: npm ci --omit=dev --ignore-scripts
      # Agent scheduling uses cron-parser. Install runtime dependencies without
      # Electron or browser binaries; desktop/browser E2E has a separate gate.
      - name: Storage, runtime, update and input regressions
        run: |
          node scripts/selftest-one.js reviewstorage
          node scripts/selftest-one.js reviewruntime
          node scripts/selftest-one.js reviewupdate
          node scripts/selftest-one.js reviewinputmetrics
          node scripts/selftest-one.js sched
          node scripts/selftest-one.js rpalifecycle
          node scripts/selftest-one.js statusrefresh
          node scripts/selftest-one.js cloudrecovery
          node scripts/selftest-one.js optimizationintegration
          node scripts/selftest-one.js restorejournal
          node scripts/selftest-one.js diagnosticlauncher
          node scripts/selftest-one.js mcptransport
          node scripts/selftest-one.js accountstore
          node scripts/selftest-one.js workbenchboundaries
          node scripts/selftest-one.js agentstore
          node scripts/selftest-one.js agentstreaming
          node scripts/selftest-one.js agentretention
          node scripts/selftest-one.js agentmcplifecycle
          node scripts/selftest-one.js sqlitestore
          node scripts/selftest-one.js profiledeletejournal
          node scripts/selftest-one.js agentdurability

  desktop-gates:
    name: Electron desktop behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run rebuild:ui
      - name: Real DOM, preload, IPC, SQLite and editor conflict gates
        env:
          OPENBROWSER_MASTER_KEY_FILE: ${{ runner.temp }}/openbrowser-desktop.key
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            if node scripts/desktop-ci-gates.test.js; then
              :
            else
              status=$?
              printf '::error::Desktop gate failed: Wrapper self-test (exit %d)\n' "$status"
              exit "$status"
            fi
          fi
          bash scripts/desktop-ci-gates.sh
      - name: Measure default workbench responsiveness
        timeout-minutes: 12
        # Same macOS retry rationale: the 5fdeea2/f3f70f2 runs missed the
        # interaction budget by ~3% (search p95 1550ms vs 1500ms) while the
        # same code passes with headroom on Linux/Windows — hosted-runner
        # jitter, not a regression. f3f70f2..5861594c additionally WEDGED at
        # the 1000-profile phase (same code, healthy runners finish in ~10s)
        # in two layers: some wedges defeat every armed Playwright timeout,
        # and even a cleanly-failing attempt hung after its error printed —
        # SIGKILLing the wedged Electron leaves its forked helpers holding
        # the stdio pipes, so the Node process never drains and never exits
        # (reproduced locally with a stopped Electron tree). The benchmark
        # now hard-exits on success/failure and force-exits (code 2) after
        # 150s without progress; the shell below kills it outright at 240s
        # as the blocked-loop backstop. A wedged macOS attempt therefore
        # fails into these retries within ~3 minutes instead of burning the
        # whole step budget. Linux/Windows stay single-shot.
        run: |
          bench() (
            set +e
            node scripts/benchmark-workbench.js --sizes 10,100,1000 --interaction-budget-ms 1500 --output ../work/workbench-performance/report.json &
            bench_pid=$!
            ( sleep 240 && kill -9 "$bench_pid" 2>/dev/null ) &
            watchdog_pid=$!
            wait "$bench_pid"
            code=$?
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            exit "$code"
          )
          if bench; then exit 0; fi
          if [[ "$RUNNER_OS" != "macOS" ]]; then exit 1; fi
          for attempt in 2 3; do
            echo "::warning::workbench benchmark failed on macOS (attempt $((attempt - 1))); hosted-runner jitter/wedge class"
            if bench; then exit 0; fi
          done
          exit 1
      - name: Preserve default workbench performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workbench-performance-${{ matrix.os }}
          path: work/workbench-performance/
          if-no-files-found: warn

  # ~200 lines of Windows FFI (process/lock.rs, guardian.rs) compile to nothing
  # on Linux: cargo skips cfg(windows) blocks entirely, so per-push CI never
  # saw them and Windows-only regressions surfaced only in manual release
  # builds (see rust-core-decision.md: v1.0.27 fixed a string of Windows-only
  # bugs). This job compiles and tests the Windows target on every push.
  rust-windows:
    name: Rust core (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The committed macOS kernel bundle has paths up to 235 chars; with
          # the runner's workspace prefix they exceed Windows MAX_PATH and
          # checkout dies with "Filename too long". Cargo never reads kernels,
          # so exclude the tree — same block the smoke jobs already use.
          sparse-checkout: |
            /*
            !/Browserapp/kernels/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # Cache the cargo registry + target dir across runs (the Node jobs all
      # use actions/setup-node's npm cache; the Rust graph was rebuilt cold
      # on every push before this).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
