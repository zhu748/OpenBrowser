[package]
name = "openbrowser-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["OpenBrowser Team"]
description = "High-performance Rust core engine for OpenBrowser"

[dependencies]
# Features kept to what the crate actually uses (net / io-util / sync / time /
# rt-multi-thread / macros) instead of "full": the binary ships inside every
# installer, and the trimmed feature set cuts compile time and binary size.
tokio = { version = "1", features = [
    "net",
    "io-util",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
md-5 = "0.11"
rand = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Features kept to what the crate actually references. The two Win32_UI_*
# features (windowing/messaging and keyboard/mouse input) were removed
# 2026-11 after a verified zero-reference grep across the crate's history.
# Win32_Security is retained deliberately: it may be a transitive
# requirement of the Threading/JobObjects surface and cannot be
# compile-verified locally (no cargo in the dev sandbox; the rust-windows
# CI job is the gate).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_JobObjects",
] }
